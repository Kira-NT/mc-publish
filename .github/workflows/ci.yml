name: ci

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js v24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Set up node modules
      run: npm ci

    - name: Build artifacts
      run: npm run build

    - name: Execute tests
      run: npm run test
